<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PERT Swimlane{% endblock %}</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid d-flex align-items-center">
      <a class="navbar-brand" href="{{ url_for('main.index') }}">PERT Swimlane</a>
      <div class="ms-auto" {% block navbar_right_attrs %}{% endblock %}>{% block navbar_right %}{% endblock %}</div>
    </div>
  </nav>
  <main class="container-fluid">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
