{% for requirement in requirements %}
{% set trace = requirement.traceability %}
<div class="requirement-row requirement-row--{{ trace.coverage }}"
     data-coverage="{{ trace.coverage }}">
<form id="requirement-update-{{ requirement.id }}" method="POST"
      action="{{ url_for('main.manage_requirements', id=project.id) }}"
      hx-post="{{ url_for('main.manage_requirements', id=project.id) }}"
      hx-target="#requirements-list" hx-swap="innerHTML">
  <input type="hidden" name="action" value="update">
  <input type="hidden" name="requirement_id" value="{{ requirement.id }}">
  <input type="hidden" name="partial" value="requirements">
  <div class="requirement-code">{{ requirement.code }}</div>
  <input class="form-control form-control-sm" name="title" value="{{ requirement.title }}"
         aria-label="Requirement title" required>
  <textarea class="form-control form-control-sm" name="description" rows="1"
            placeholder="Description">{{ requirement.description or "" }}</textarea>
  <select class="form-select form-select-sm" name="moscow" aria-label="MoSCoW priority">
    {% for value, label in moscow_choices %}
    <option value="{{ value }}"{% if requirement.moscow == value %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</form>
<div class="requirement-trace-tasks font-monospace small" title="Linked tasks">
  {{ trace.task_codes }}
</div>
<div class="requirement-trace-status">{{ trace.status_display }}</div>
<div class="requirement-trace-coverage" title="{{ trace.coverage_label }}">
  <span class="requirement-coverage-emoji" aria-hidden="true">{{ trace.coverage_emoji }}</span>
  <span class="visually-hidden">{{ trace.coverage_label }}</span>
</div>
<button class="btn btn-sm btn-outline-secondary" type="submit"
        form="requirement-update-{{ requirement.id }}">Save</button>
<form method="POST"
      action="{{ url_for('main.manage_requirements', id=project.id) }}"
      hx-post="{{ url_for('main.manage_requirements', id=project.id) }}"
      hx-target="#requirements-list" hx-swap="innerHTML"
      onsubmit="return confirm('Delete this requirement?');">
  <input type="hidden" name="action" value="delete">
  <input type="hidden" name="requirement_id" value="{{ requirement.id }}">
  <input type="hidden" name="partial" value="requirements">
  <button class="btn btn-sm btn-outline-danger" type="submit">×</button>
</form>
</div>
{% else %}
<p class="text-muted small mb-0">No business requirements yet.</p>
{% endfor %}
