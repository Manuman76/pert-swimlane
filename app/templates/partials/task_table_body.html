{% for task in tasks %}
  {% set task_errors = errors.get(task.id, []) if errors else [] %}
  {% set draft = drafts.get(task.id) if drafts else None %}
  {% include "partials/task_row.html" %}
{% else %}
<tr class="empty-row"><td colspan="10" class="text-muted text-center py-2">No tasks yet. Click "+ Add task" to begin.</td></tr>
{% endfor %}
